plugins { id 'net.minecraftforge.gradle' version '6.0.54' }
group = 'dev.sunrin.integration'
version = '0.1.0'
base { archivesName = 'sunrin-useflow-observer' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    compileOnly files('../../build/classes/java/main')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
